name: CI

# Fast gate (docs/testing-strategy.md §7): build + typecheck + AWS-free unit tests on
# every push. Deliberately CREDENTIAL-FREE: this workflow reads no repository secret, sets
# no env, and touches no AWS. It is green from a bare checkout and runnable by a fork PR.
# Keep it that way — anything needing credentials belongs in playwright.yml.
#
# Explicitly NOT here:
#   - the 8 backend suites under backend/test/*.test.ts (`npm test`): they mutate LIVE
#     staging DynamoDB and need `.env.test`. Only `test:unit` (backend/test/unit/) is
#     credential-free. See backend/vitest.unit.config.ts.
#   - playwright e2e: needs a deployed staging target. Stays in playwright.yml.

on:
  push:
  pull_request:

# A branch pushed as part of an open PR would otherwise run this job twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-typecheck-unit:
    name: build + typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to 22 to match the Lambda runtime (CLAUDE.md), not `lts/*`, which
          # silently rolls to the next LTS.
          node-version: '22'

      - name: Install dependencies
        # `npm ci` — the install is pinned to package-lock.json, so CI builds the exact
        # dependency set the operator reviewed. Do NOT replace this with
        # `rm -f package-lock.json && npm install`: that silently unpins CI.
        #
        # This requires package-lock.json to carry the Linux entries of every native
        # binary family. npm only records the optional platform variants it resolved on
        # the authoring host (npm/cli#4828), so a lockfile written on macOS lists only
        # the darwin ones; `npm ci` still exits 0 (the entries are optional, so npm just
        # skips them) and the failure surfaces one step later, in admin's `vite build`:
        # "Cannot find module @rollup/rollup-linux-x64-gnu".
        #
        # The linux/win entries for rollup, @tailwindcss/oxide, @unrs/resolver-binding,
        # lightningcss and sharp were added to the lockfile by hand at the versions their
        # parents already pin. If you ever regenerate the lockfile on macOS, re-check
        # those families before pushing. See docs/TECH-DEBT.md.
        run: npm ci

      # Build first: `npm run typecheck` does not emit, so the workspaces that consume
      # @amodx/shared, @amodx/effects and @amodx/plugins resolve their types from those
      # packages' dist/*.d.ts and need them on disk. `next build` also generates
      # renderer/.next/types/**, which renderer/tsconfig.json includes.
      - name: Build (shared -> effects -> plugins -> backend -> admin -> renderer -> mcp-server -> infra)
        run: npm run build

      - name: Typecheck (all 8 workspaces, tsc --noEmit)
        run: npm run typecheck

      # The three pure-unit suites (test-1 seeded backend's; test-3 added the other two).
      # Separate steps rather than one aggregated script so a red run names the workspace
      # in the step title without anyone having to open the log.
      #
      # Each runs a DIFFERENT runner invocation but the same guarantee: no AWS client is
      # ever constructed for real (the renderer suite mocks @aws-sdk/client-dynamodb and
      # next/navigation at the import boundary), no `.env*` is read, nothing binds a port.
      # None of them needs the build above — they import TypeScript sources directly — but
      # they are placed after it so a compile-level breakage is reported by the build step,
      # which says so plainly, rather than as a transform error inside a test run.
      - name: Backend unit tests (no AWS, no credentials)
        working-directory: backend
        run: npm run test:unit

      - name: Shared schema unit tests (Zod contracts; zod is the only dependency)
        working-directory: packages/shared
        run: npm test

      - name: Renderer unit tests (tenant-directory TTL/bound/fail-open, not-found handoff)
        # NOT the serving-contract suite — that is the `serving-contract` job below and is
        # the only gate here that boots a server. `renderer/vitest.config.ts` narrows
        # `include` to test/unit/ so the two can never run each other.
        working-directory: renderer
        run: npm test

  serving-contract:
    # The executable form of docs/caching-architecture.md § "Serving contract" (test-2).
    # A separate job, not a step of the one above, for two reasons: it is the only gate that
    # boots a server and so has a failure mode of its own worth reading in isolation, and it
    # needs only the three packages the renderer imports — not admin, infra or mcp-server.
    #
    # STILL CREDENTIAL-FREE, and not only by omission here. It reads no `secrets.*` and sets
    # no `env:`; on top of that, renderer/test/serving-contract/harness.mjs CONSTRUCTS the
    # environment of the renderer it spawns (four OS variables pass through; everything else
    # is a literal) and hides `renderer/.env*` from every process in the tree that build
    # spawns. So this job cannot pass because of a credential a fork's CI would not have —
    # assertions `(iso1)`-`(iso4)` fail if that regresses, and `(iso3)` measures the coverage
    # rather than assuming it. All DynamoDB traffic is pinned to an in-process stub on
    # 127.0.0.1.
    name: serving contract (renderer)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same pin, same reason: node:test is the suite's runner and 22 is the Lambda runtime.
          node-version: '22'

      - name: Install dependencies
        # See the `npm ci` note in the job above — the same lockfile caveat applies.
        run: npm ci

      # Only the packages the renderer resolves types and code from. The suite runs
      # `next build` itself, so the renderer is deliberately NOT built here.
      - name: Build renderer prerequisites (shared -> effects -> plugins)
        run: |
          npm run build -w packages/shared
          npm run build -w packages/effects
          npm run build -w packages/plugins

      - name: Serving-contract suite (builds + serves the renderer, local DDB stub)
        working-directory: renderer
        run: npm run test:serving

  infra-synth:
    # The CloudFront half of the same contract (test-4). `serving-contract` above measures the
    # ORIGIN end-to-end but cannot see the edge, so the cache-key allowlists, the viewer-request
    # CloudFront Function and the IAM blast radius of cache invalidation are asserted here
    # against a REAL `cdk synth` of `AmodxStack` — no snapshot file, no fixture template.
    #
    # A separate job for the same two reasons as `serving-contract`: a failure mode worth
    # reading in isolation, and a different (larger) prerequisite set.
    #
    # CREDENTIAL-FREE, and again not only by omission. It reads no `secrets.*` and sets no
    # `env:`. On top of that the suite itself cannot reach AWS: the test stack is constructed
    # with no `domains.root`, so `route53.HostedZone.fromLookup` — the stack's only synth-time
    # context provider — is never instantiated, and `installProcessTreeIsolation()` strips every
    # credential-shaped variable, points the SDK's file credential chain at a nonexistent path,
    # disables IMDS and hides `renderer/.env*` + `admin/.env*` from the whole process tree.
    # `(iso1)`-`(iso3)` fail if any of that regresses.
    #
    # WHY THIS JOB IS SLOW AND WHY THAT IS NOT A BUG: `Template.fromStack` runs the renderer
    # OpenNext build, the admin vite build and ~65 esbuild bundles, because those builds are
    # invoked from inside the CDK constructors (infra/lib/renderer-hosting.ts:62,
    # infra/lib/admin-hosting.ts:31). 52-58 s on a warm developer machine; a cold runner has no
    # build caches. Removing that cost means lifting build orchestration out of the constructs,
    # which is an `infra/lib` change (docs/TECH-DEBT.md).
    name: infra synth assertions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same pin, same reason as the jobs above.
          node-version: '22'

      - name: Install dependencies
        # See the `npm ci` note in the first job — the same lockfile caveat applies, and it
        # bites here too: the synth runs admin's `vite build`, which is exactly where a missing
        # `@rollup/rollup-linux-x64-gnu` entry surfaced last time.
        run: npm ci

      # The synth builds the renderer and admin itself, so neither is built here — but both
      # resolve types and code from these three packages, and so does esbuild when it bundles
      # the backend handlers for every NodejsFunction.
      - name: Build synth prerequisites (shared -> effects -> plugins)
        run: |
          npm run build -w packages/shared
          npm run build -w packages/effects
          npm run build -w packages/plugins

      - name: Infra synth assertions (real Template.fromStack, no AWS)
        working-directory: infra
        run: npm test

name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high severity, production deps only)
        # audit-gate wraps `npm audit --omit=dev --json`: fails on any unaccepted
        # high/critical advisory, suppresses (loudly) only the exact GHSA ids we
        # accepted — currently postcss+sharp pinned inside next 16.2.12. --omit=dev
        # semantics kept: dev deps like aws-cdk-lib have known build-time-only
        # vulnerabilities. See docs/TECH-DEBT.md § Dependency Audit Remediation.
        run: node scripts/audit-gate.mjs
        continue-on-error: false

      - name: Security audit report
        if: failure()
        run: |
          echo "## Security Audit Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "High or critical vulnerabilities detected. Run \`npm audit\` locally for details." >> $GITHUB_STEP_SUMMARY
          npm audit >> $GITHUB_STEP_SUMMARY 2>&1 || true

  audit-backend:
    name: Backend audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend dependencies
        # --ignore-scripts: npm ci from a workspace subdir executes the ROOT
        # postinstall (patch-package, added by cache-8) without the root .bin on
        # PATH -> exit 127. This job only audits the lockfile; no install script
        # output (open-next patch, native binaries) is ever used here.
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Security audit (backend)
        # --omit=dev for the same reason as the root job: dev/build tooling
        # advisories (esbuild, vitest chains) never reach the Lambda runtime.
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

  audit-renderer:
    name: Renderer audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install renderer dependencies
        # --ignore-scripts: same reason as the backend job (root postinstall
        # fails from a subdir install; audit never uses script output).
        working-directory: renderer
        run: npm ci --ignore-scripts

      - name: Security audit (renderer)
        # Same gate as the root job: the renderer's residual highs are the same
        # next-16.2.12-pinned postcss/sharp advisories accepted in TECH-DEBT.
        working-directory: renderer
        run: node ../scripts/audit-gate.mjs
        continue-on-error: false

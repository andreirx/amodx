name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    # Pinned: Playwright 1.57.0 (package-lock.json) supports Ubuntu up to 24.04; `ubuntu-latest` rolled to 26.04 (CL1-RUNNER-OS).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to 22 for the same reason as ci.yml: `lts/*` rolls to the next LTS silently.
          node-version: '22'

      - name: Install dependencies
        # `npm ci`: install the versions recorded in package-lock.json. See the note at the install step
        # of ci.yml (the Linux entries of the lockfile).
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 1. Run Backend Tests (Verify Logic & DB Access)
      - name: Run Backend Integration Tests
        working-directory: ./backend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "eu-central-1"
          TABLE_NAME: ${{ secrets.TABLE_NAME }}
        run: npm test

      # 2. Run E2E Tests (Verify Rendering)
      - name: Run Playwright E2E Tests
        env:
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          AMODX_API_KEY: ${{ secrets.AMODX_API_KEY }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
